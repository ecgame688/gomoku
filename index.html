<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f2219">
    <title>Gomoku · Caro — Install the game</title>
    <meta name="description" content="Install Gomoku · Caro. Choose your language to open the download page.">
    <meta property="og:title" content="Gomoku · Caro — Install the game">
    <meta property="og:description" content="Get five in a row before the computer does, or challenge a friend on the same phone. Gomoku and Vietnamese Caro rules, playable offline.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="assets/icon.png">
    <link rel="icon" href="assets/icon.png" type="image/png">
    <link rel="stylesheet" href="assets/install.css">
</head>
<body>
    <main class="wrap">
        <img class="icon" src="assets/icon.png" width="96" height="96" alt="Gomoku · Caro">
        <h1>Gomoku · Caro</h1>
        <p class="sub">Choose your language</p>
        <nav aria-label="Language" style="display:block">
        <a class="btn astore" href="install_en.html" lang="en" hreflang="en">English</a>
        <a class="btn astore" href="install_vi.html" lang="vi" hreflang="vi">Tiếng Việt</a>
        <a class="btn astore" href="install_ko.html" lang="ko" hreflang="ko">한국어</a>
        <a class="btn astore" href="install_ja.html" lang="ja" hreflang="ja">日本語</a>
        <a class="btn astore" href="install_zh.html" lang="zh-Hant" hreflang="zh-Hant">繁體中文</a>
        </nav>
        <footer><a href="privacy.html">Privacy Policy</a></footer>
    </main>
    <script>
    (function () {
        'use strict';
        // zh (mọi biến thể: zh-TW, zh-Hant, zh-HK, zh-CN…) → trang Phồn thể install_zh.html
        var supported = ["en", "vi", "ko", "ja", "zh"];
        var preferred = navigator.languages && navigator.languages.length
            ? navigator.languages : [navigator.language || 'en'];
        var selected = 'en';
        for (var i = 0; i < preferred.length; i++) {
            var code = String(preferred[i]).toLowerCase().split(/[-_]/)[0];
            if (supported.indexOf(code) !== -1) {
                selected = code;
                break;
            }
        }
        window.location.replace('install_' + selected + '.html' + window.location.hash);
    }());
    </script>
</body>
</html>
